CONFIG_FLASH_MSPI_NOR=y
CONFIG_FLASH_MSPI_NOR_LAYOUT_PAGE_SIZE=4096

# Wi-Fi station
CONFIG_DOOR_LOCK_WIFI=y
CONFIG_WIFI_NRF71_PATCH=y

# Lower System ON idle current: see lib_nrf71_idle_power. Keep the
# default RAM_RETAIN_FULL tier; RAM_RETAIN_USED_ONLY has been observed
# to cause issues on Wi-Fi builds.
CONFIG_NRF71_IDLE_POWER=y
