sample:
  description: Door lock sample application
  name: ncs-door-lock-sample
common:
  sysbuild: true
  build_only: true
tests:
  smoke.door_lock.nfc-uwb.qm35_dfu-smp_dfu:
    tags:
      - dfu_supported
    platform_allow: &platform_5340
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms: *platform_5340
    extra_args:
      - SNIPPET="uwb_qm35_dfu"
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_DFU_VERSION_COMPARISON_DIFFERENT=y
  app.door_lock.nfc-uwb.qm35_dfu-smp_dfu:
    tags:
      - dfu_supported
    platform_allow: &platform_54lm20
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platform_54lm20
    extra_args:
      - SNIPPET="uwb_qm35_dfu"
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_DFU_VERSION_COMPARISON_DIFFERENT=y
  smoke.door_lock.nfc.bt_nus:
    platform_allow: &platform_54l15_54lm20
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platform_54l15_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="bt_nus"
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE=n
  app.door_lock.nfc:
    platform_allow: &platform_52840_5340
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms: *platform_52840_5340
    extra_args:
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE=n
  app.door_lock.nfc-uwb.smp_dfu-bt_nus:
    tags:
      - dfu_supported
    platform_allow: &platform_5340_54lm20
      - nrf5340dk/nrf5340/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platform_5340_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;bt_nus"
  app.door_lock.nfc.aliro_minimal:
    platform_allow: &platform_54l15
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms: *platform_54l15
    extra_args:
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n
      - CONFIG_DOOR_LOCK_CREDENTIAL_ISSUER_CA=n
      - CONFIG_DOOR_LOCK_READER_CERTIFICATE=n
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE=n
  app.door_lock.nfc-uwb.smp_dfu-release:
    tags:
      - dfu_supported
    platform_allow: *platform_5340_54lm20
    integration_platforms: *platform_5340_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - FILE_SUFFIX=release
  app.door_lock.nfc.smp_dfu-bt_nus-release:
    tags:
      - dfu_supported
    platform_allow: &platform_all
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platform_all
    extra_args:
      - aliro-access-control-app_SNIPPET="bt_nus"
      - FILE_SUFFIX=release
  do_not_test.door_lock.nfc-uwb.smp_dfu-front_back_detection:
    tags:
      - dfu_supported
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_FRONT_BACK_DETECTION=y
  do_not_test.door_lock.nfc-uwb.smp_dfu-front_back_detection-release:
    tags:
      - dfu_supported
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_FRONT_BACK_DETECTION=y
      - FILE_SUFFIX=release
  do_not_test.door_lock.nfc-uwb.smp_dfu-qm35_radar-qm35_diagnostics:
    tags:
      - dfu_supported
    platform_allow: *platform_5340
    integration_platforms: *platform_5340
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_RADAR=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_DIAGNOSTICS=y
  do_not_test.door_lock.nfc-uwb.smp_dfu-qm35_radar-uwb_disambiguation:
    tags:
      - dfu_supported
    platform_allow: *platform_5340
    integration_platforms: *platform_5340
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_RADAR=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_DISAMBIGUATION=y
