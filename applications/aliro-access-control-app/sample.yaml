sample:
  description: Door lock sample application
  name: ncs-door-lock-sample
common:
  sysbuild: true
  build_only: true
tests:
  app.door_lock.nfc-ble-uwb.bt_nus-dfu_smp-exp_fast-step_up:
    tags:
      - dfu_smp
    platform_allow: &platform_5340
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms: *platform_5340
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;dfu_smp;bt_nus"
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE_LOG_LEVEL_DBG=y
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y

  app.door_lock.nfc-ble-uwb.bt_nus-exp_fast-release:
    platform_allow: &platform_54lm20
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;bt_nus"
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n
      - FILE_SUFFIX=release

  app.door_lock.nfc-ble-uwb.bt_nus-exp_fast:
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;bt_nus"
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n

  app.door_lock.nfc.bt_nus-exp_fast-release:
    platform_allow: &platform_54l15_52840_5340
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms: *platform_54l15_52840_5340
    extra_args:
      - aliro-access-control-app_SNIPPET=bt_nus
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n
      - FILE_SUFFIX=release

  app.door_lock.nfc.bt_nus-exp_fast:
    platform_allow: *platform_54l15_52840_5340
    integration_platforms: *platform_54l15_52840_5340
    extra_args:
      - aliro-access-control-app_SNIPPET=bt_nus
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n

  app.door_lock.nfc-ble-uwb.dfu_smp-step_up:
    tags:
      - dfu_smp
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;dfu_smp"
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE_LOG_LEVEL_DBG=y
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y

  app.door_lock.nfc.dfu_smp-step_up:
    tags:
      - dfu_smp
    platform_allow: *platform_54l15_52840_5340
    integration_platforms: *platform_54l15_52840_5340
    extra_args:
      - aliro-access-control-app_SNIPPET=dfu_smp
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE_LOG_LEVEL_DBG=y
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y

  app.door_lock.nfc-ble-uwb.dfu_smp-qm35_dfu:
    tags:
      - dfu_smp
    platform_allow: *platform_5340
    integration_platforms: *platform_5340
    extra_args:
      - SNIPPET="uwb_qm35_dfu"
      - aliro-access-control-app_SNIPPET="uwb_qm35;dfu_smp"
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE_LOG_LEVEL_DBG=y
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_DFU_VERSION_COMPARISON_DIFFERENT=y

  app.door_lock.nfc-ble-uwb.exp_fast-step_up-ca_cert:
    platform_allow: &platforms_5340_54lm20
      - nrf5340dk/nrf5340/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platforms_5340_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET=uwb_qm35
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y
      - CONFIG_DOOR_LOCK_CREDENTIAL_ISSUER_CA=y
      - CONFIG_DOOR_LOCK_READER_CERTIFICATE=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_DIAGNOSTICS=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_RADAR=y

  app.door_lock.nfc.exp_fast-step_up-ca_cert:
    platform_allow: &platforms_all
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms: *platforms_all
    extra_args:
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y
      - CONFIG_DOOR_LOCK_CREDENTIAL_ISSUER_CA=y
      - CONFIG_DOOR_LOCK_READER_CERTIFICATE=y

  smoke.door_lock.nfc-ble-uwb.bt_nus-dfu_smp-exp_fast-step_up-ca_cert:
    tags:
      - dfu_smp
    platform_allow: *platform_5340
    integration_platforms: *platform_5340
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35;dfu_smp;bt_nus"
      - CONFIG_DOOR_LOCK_DFU_SMP_SERVICE_LOG_LEVEL_DBG=y
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=y
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y
      - CONFIG_DOOR_LOCK_CREDENTIAL_ISSUER_CA=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_RADAR=y
      - CONFIG_DOOR_LOCK_ALIRO_UWB_DISAMBIGUATION=y

  smoke.door_lock.nfc-ble-uwb:
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET=uwb_qm35
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=n

  smoke.door_lock.nfc.bt_nus-step_up:
    platform_allow: &platform_52840
      - nrf52840dk/nrf52840
    integration_platforms: *platform_52840
    extra_args:
      - aliro-access-control-app_SNIPPET=bt_nus
      - CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
      - CONFIG_DOOR_LOCK_STEP_UP_PHASE=y

  smoke.door_lock.nfc:
    platform_allow: *platform_5340
    integration_platforms: *platform_5340

  do_not_test.door_lock.nfc-ble-uwb.front_back_detection:
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET=uwb_qm35
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_FRONT_BACK_DETECTION=y

  do_not_test.door_lock.nfc-ble-uwb.front_back_detection-release:
    platform_allow: *platform_54lm20
    integration_platforms: *platform_54lm20
    extra_args:
      - aliro-access-control-app_SNIPPET="uwb_qm35"
      - FILE_SUFFIX=release
      - CONFIG_DOOR_LOCK_ALIRO_UWB_QM35_FRONT_BACK_DETECTION=y
