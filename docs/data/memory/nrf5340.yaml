# Memory requirement data for nRF5340 DK.
# Partition sizes come from dts/door_lock/common/*_partitions.dtsi.
# Usage values were measured on the commit listed in docs/include/memory_values_commit.txt.
# MCUboot usage is intentionally omitted; the partition is shown as fully reserved.

board:
  name: nRF5340 DK
  nvm_total_kb: 1024
  ram_total_kb: 512
legend_threshold_kb: 8
layouts:
  debug:
    partitions:
    - id: boot
      label: MCUboot
      size_kb: 32
      order: 1
    - id: slot0
      label: Application
      size_kb: 956
      order: 2
    - id: factory_data
      label: Factory data
      size_kb: 4
      order: 3
    - id: storage
      label: Settings
      size_kb: 32
      order: 4
  release:
    partitions:
    - id: boot
      label: MCUboot
      size_kb: 32
      order: 1
    - id: slot0
      label: Application
      size_kb: 956
      order: 2
    - id: factory_data
      label: Factory data
      size_kb: 4
      order: 3
    - id: storage
      label: Settings
      size_kb: 32
      order: 4
