manifest:
  self:
    west-commands: scripts/west-commands.yml
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.0
      import:
        name-blocklist:
          - matter
    - name: ncs-matter
      remote: ncs
      repo-path: ncs-matter
      revision: v1.0.0
      import: true
    - name: ncs-door-lock-app-extensions
      remote: ncs
      repo-path: ncs-door-lock-app-extensions
      revision: v1.2.0
      groups:
        - ncs-door-lock-app-extensions
  group-filter:
    - -ncs-door-lock-app-extensions
