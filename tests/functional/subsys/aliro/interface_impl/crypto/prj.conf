CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Enable crypto
CONFIG_NRF_SECURITY=y

CONFIG_NCS_ALIRO=y
CONFIG_DOOR_LOCK_ALIRO_READER_STORAGE=y
CONFIG_DOOR_LOCK_ALIRO_READER_STORAGE_GROUP_RESOLVING_KEY_SUPPORT=y
CONFIG_DOOR_LOCK_ALIRO_INTERFACE_IMPL_CRYPTO=y
